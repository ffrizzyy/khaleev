# Alembic configuration for the local Khaleev SQLite database.
#
# `sqlalchemy.url` is intentionally empty: `src/khaleev/migrations/env.py`
# resolves the database file from `Settings.data_dir` so a checkout needs no
# absolute paths and no credentials. Tests may override the URL or hand env.py a
# live connection through `config.attributes["connection"]`.

[alembic]
script_location = %(here)s/src/khaleev/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
